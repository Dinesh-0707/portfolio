name: Keep Streamlit demos awake

on:
  schedule:
    # Every 6 hours. Streamlit's free tier sleeps apps after a period with no
    # visitors, so a regular visit keeps the portfolio demos instantly usable.
    - cron: "17 */6 * * *"
  # Run it by hand from the Actions tab
  workflow_dispatch:
  # Run once whenever the script or this workflow changes
  push:
    branches: [main]
    paths:
      - scripts/wake_streamlit.py
      - .github/workflows/keep-streamlit-awake.yml

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          pip install playwright==1.64.1
          python -m playwright install --with-deps chromium

      - name: Visit each app
        run: python scripts/wake_streamlit.py
